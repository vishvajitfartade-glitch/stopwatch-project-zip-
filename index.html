<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive stopwatch with start, pause, reset and lap functionality.">
  <title>Stopwatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="stopwatch-card" aria-labelledby="title">
      <p class="eyebrow">LEVEL 2 • DAY 2</p>
      <h1 id="title">Stopwatch</h1>

      <div class="display" aria-live="polite">
        <span id="time">00:00:00.00</span>
      </div>

      <div class="controls" aria-label="Stopwatch controls">
        <button id="startBtn" class="primary">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="lapBtn">Lap</button>
        <button id="resetBtn" class="danger">Reset</button>
      </div>

      <div class="laps-section">
        <div class="laps-header">
          <h2>Lap Times</h2>
          <span id="lapCount">0 laps</span>
        </div>
        <ol id="laps" class="laps" aria-live="polite"></ol>
        <p id="emptyMessage" class="empty">No laps recorded yet.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
